
spring:
  application:
    name: foodly-iam-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/foodly_iam}
    username: ${DB_USERNAME:foodly_iam}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

server:
  port: 8081

foodly:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
    expiration-minutes: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info
